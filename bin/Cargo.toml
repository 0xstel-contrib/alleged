[package]
name = "alleged"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["tui", "caldav", "api"]
tui = []
api = ["dep:serde", "dep:actix-web"]
caldav = ["dep:http", "dep:hyper-rustls", "dep:hyper-util", "dep:icalendar", "dep:libdav", "dep:tower-http", "dep:vstorage"]

[dependencies]
actix-web = { version = "4", optional = true }
alleged-lib = { workspace = true, features = ["icalendar", "hash"] }
anyhow = "1.0.104"
argh = { version = "0.1.19", default-features = false, features = ["help"] }
http = { version = "1.5.0", optional = true }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["ring", "http1", "native-tokio", "tls12", "logging"], optional = true }
hyper-util = { version = "0.1.20", features = ["client"], optional = true }
icalendar = { workspace = true, optional = true }
libdav = { version = "0.10.6", optional = true }
serde = { workspace = true, optional = true }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["auth"], optional = true }
vstorage = { version = "0.10.0", default-features = false, optional = true }
